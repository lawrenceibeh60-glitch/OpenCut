name: Bun CI

concurrency:
  group: kyrocut-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "*.md"

jobs:
  ci:
    name: Workspace CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true

      - name: Run workspace CI
        run: moon ci

  rust-engine:
    name: Rust engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true

      - name: Set up Bun for the pinned FFmpeg dependency
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install the pinned LGPL FFmpeg libraries
        run: bun run crates/media/setup/setup.ts

      - name: Configure FFmpeg for the Rust bindings
        shell: bash
        run: echo "FFMPEG_DIR=$GITHUB_WORKSPACE/.cache/media/ffmpeg-8.1.3-linux-x86_64" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test shared engine and media crates
        # Cargo must be allowed to refresh Cargo.lock for the newly added
        # ffmpeg-next dependency; the resulting lockfile is committed by the
        # follow-up dependency-lock update.
        run: cargo test -p kyrocut-core -p kyrocut-render -p kyrocut-audio -p kyrocut-media

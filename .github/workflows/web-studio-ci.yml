name: KYROCUT X1 Web Studio

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/kyrocut-x1-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyrocut-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests, typecheck, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install
      - name: Unit tests
        run: bun run test
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build

  rust-renderer:
    name: Rust renderer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kyrocut-render

  rust-wasm:
    name: Rust WebAssembly bridge build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build browser WebAssembly package
        working-directory: crates/kyrocut-render
        run: wasm-pack build --target web --out-dir ../../apps/web/src/generated/renderer-wasm --out-name kyrocut_renderer --release

[package]
name = "kyrocut-render"
description = "Deterministic CPU RGBA compositing primitives for KYROCUT X1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kyrocut-core = { workspace = true }
serde_json = "1.0"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

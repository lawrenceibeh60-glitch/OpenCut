[workspace]
resolver = "3"
members = [
  'apps/desktop',
  'crates/kyrocut-audio',
  'crates/kyrocut-core',
  'crates/kyrocut-render',
  'crates/media',
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
kyrocut-core = { path = "crates/kyrocut-core" }
kyrocut-render = { path = "crates/kyrocut-render" }
kyrocut-audio = { path = "crates/kyrocut-audio" }
kyrocut-media = { path = "crates/media" }
